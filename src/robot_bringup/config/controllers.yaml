controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Publicador de estados articulares
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controlador Cinemático Holonómico Mecanum
    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController

    # Controlador de posición articular directa para el brazo
    arm_controller:
      type: position_controllers/JointGroupPositionController

    # Controlador de posición para la pinza
    gripper_controller:
      type: position_controllers/JointGroupPositionController

# ==================== Parámetros de la Base Mecanum ====================
mecanum_controller:
  ros__parameters:
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"

    front_left_wheel_state_joint_name: "front_left_wheel_joint"
    front_right_wheel_state_joint_name: "front_right_wheel_joint"
    rear_left_wheel_state_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_state_joint_name: "rear_right_wheel_joint"

    kinematics:
      wheels_radius: 0.035
      sum_of_robot_center_projection_on_X_Y_axis: 0.1875  # 0.0825 (l/2) + 0.105 (w/2)

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: true

    # Límites de velocidad para movimiento suave
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
      y:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.14
        min_velocity: -3.14

# ==================== Parámetros del Brazo Articulado ====================
arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4

# ==================== Parámetros de la Pinza ====================
gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint
